<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>快捷键设置 — Pixel Murmur</title>
<style>
  :root {
    --bg: #161B24; --frame: #2C3546; --text: #EEF1F5; --sub: #9AA6B8;
    --accent: #E08A5C; --accent-text: #F2B48F; --on-accent: #1A1208;
    --card: #1E2532; --card-bd: #2A3343; --card2: #232B39;
    --edit-bg: #2A2420; --edit-bd: #E08A5C; --icon-bg: #2A3242;
    --seg: #0F131A; --seg-on: #2E3748;
    --key-bg: #2A3242; --key-bd: #3B4558; --key-shadow: #10141B;
    --footer: #121720; --line: #2A3343; --ok: #7CD9A8; --err: #FF8A80; --warn: #F5C26B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    user-select: none; overflow: hidden; }
  body { display: flex; flex-direction: column; border: 1px solid var(--frame); }
  button { font: inherit; cursor: pointer; color: inherit; }
  button:focus-visible { outline: 2px solid #6aa2ff; outline-offset: 2px; }

  .titlebar { height: 36px; display: flex; align-items: center; justify-content: space-between;
    padding-left: 14px; font-size: 12px; color: var(--sub); }
  .titlebar .win { display: flex; height: 100%; }
  .titlebar .win button { width: 46px; height: 100%; border: 0; background: transparent; color: var(--sub); }
  .titlebar .win button:hover { background: #2A3242; color: var(--text); }
  .titlebar .win button.x:hover { background: #C42B1C; color: #fff; }

  .head { padding: 4px 24px 18px; display: flex; align-items: center; gap: 14px; }
  .avatar { position: relative; width: 48px; height: 48px; flex: none; border-radius: 12px; background: #222A38; }
  .avatar i { position: absolute; left: 0; top: 0; width: 3px; height: 3px; }
  .head h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .2px; }
  .head p { margin: 2px 0 0; font-size: 13px; color: var(--sub); }

  .bar { padding: 0 24px 14px; display: flex; align-items: center; justify-content: space-between; }
  .seg { display: flex; padding: 3px; gap: 2px; border-radius: 6px; background: var(--seg); }
  .seg button { height: 30px; padding: 0 14px; border: 0; border-radius: 4px; background: transparent; color: var(--sub); font-size: 13px; }
  .seg button.on { background: var(--seg-on); color: #fff; }
  .hint { font-size: 12px; color: var(--sub); }

  .rows { margin: 0 24px; display: flex; flex-direction: column; gap: 8px; }
  .row { position: relative; display: grid; grid-template-columns: 34px 150px minmax(0, 1fr) auto;
    gap: 12px; align-items: center; padding: 11px 12px; border-radius: 6px;
    background: var(--card); border: 1px solid var(--card-bd); overflow: hidden; }
  .row.editing { background: var(--edit-bg); border-color: var(--edit-bd); }
  .row.bad { border-color: var(--err); }
  .ico { width: 34px; height: 34px; border-radius: 8px; background: var(--icon-bg); color: var(--accent);
    display: flex; align-items: center; justify-content: center; }
  .name b { display: block; font-size: 14px; font-weight: 600; }
  .name span { font-size: 12px; color: var(--sub); }
  .combo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .keys { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; min-height: 28px; }
  .key { display: inline-flex; align-items: center; height: 26px; padding: 0 9px; border-radius: 4px;
    background: var(--key-bg); border: 1px solid var(--key-bd); box-shadow: inset 0 -2px 0 var(--key-shadow);
    font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; color: #F2F4F8; }
  .empty { font-size: 13px; color: var(--sub); }
  .listen { font-size: 13px; color: var(--accent-text); display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .msg { font-size: 12px; }
  .acts { display: flex; align-items: center; gap: 4px; }
  .edit { height: 30px; min-width: 60px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--card2); font-size: 13px; }
  .edit:hover { border-color: #4A5568; }
  .row.editing .edit { background: transparent; border-color: var(--edit-bd); }
  .icon-btn { width: 30px; height: 30px; border: 0; border-radius: 4px; background: transparent; color: var(--sub);
    display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: #2A3242; color: var(--text); }
  .progress { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); }

  .note { margin: 12px 24px 0; font-size: 12px; line-height: 1.6; color: var(--sub); }
  .foot { margin-top: auto; padding: 14px 24px; display: flex; align-items: center; gap: 10px;
    background: var(--footer); border-top: 1px solid var(--line); }
  .status { flex: 1; font-size: 13px; color: var(--sub); }
  .btn { height: 34px; padding: 0 16px; border-radius: 4px; border: 1px solid var(--line); background: var(--card2); font-size: 13px; }
  .btn.pri { padding: 0 20px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.pri:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
  <div class="titlebar pywebview-drag-region">
    <span>Pixel Murmur</span>
    <div class="win">
      <button title="最小化" aria-label="最小化" onclick="api().minimize()">—</button>
      <button class="x" title="关闭" aria-label="关闭" onclick="api().close()">✕</button>
    </div>
  </div>

  <div class="head pywebview-drag-region">
    <div class="avatar" aria-hidden="true"><i id="avatar"></i></div>
    <div>
      <h1>快捷键设置</h1>
      <p>点「修改」后直接按下想要的组合键；按住说话的键越少越好按</p>
    </div>
  </div>

  <div class="bar">
    <div class="seg" role="group" aria-label="预设方案">
      <button data-p="pad">手柄方案</button>
      <button data-p="keyboard">键盘方案</button>
      <button data-p="custom">自定义</button>
    </div>
    <span class="hint" id="hint">保存后立即生效</span>
  </div>

  <div class="rows" id="rows"></div>

  <div class="note">单独一个键只能用 CapsLock、Pause、ScrollLock、Insert、F13–F24，其他键请加上 Ctrl / Alt / Shift。</div>

  <div class="foot">
    <span class="status" id="status"></span>
    <button class="btn" id="revert">撤销改动</button>
    <button class="btn pri" id="save">保存</button>
  </div>

<script>
const ICONS = {
  talk: '<rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path>',
  talk_send: '<path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4 20-7z"></path>',
  cancel: '<circle cx="12" cy="12" r="9"></circle><path d="m15 9-6 6M9 9l6 6"></path>',
  focus: '<rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 9h18"></path>',
  focus_wechat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path>'
};
const RESET = '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path>';
const TRASH = '<path d="M4 7h16"></path><path d="M10 11v6M14 11v6"></path><path d="M6 7l1 13h10l1-13"></path><path d="M9 7V4h6v3"></path>';
const svg = (p, s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

const SOLO = new Set(['CapsLock', 'Pause', 'ScrollLock', 'Insert']);
for (let n = 13; n <= 24; n++) SOLO.add('F' + n);
const BLOCKED = {
  'Ctrl+Space': '这是输入法中英文切换', 'Shift+Space': '这是输入法全角/半角切换', 'Alt+Space': '这是窗口菜单',
  'Alt+Tab': '这是切换窗口', 'Alt+F4': '这是关闭窗口', 'Ctrl+Shift+Esc': '这是任务管理器',
  'Ctrl+Alt+Delete': '这是系统安全界面', 'Ctrl+C': '这是复制', 'Ctrl+V': '这是粘贴', 'Ctrl+X': '这是剪切',
  'Ctrl+Z': '这是撤销', 'Ctrl+A': '这是全选', 'Ctrl+S': '这是保存'
};
const MODKEYS = new Set(['Shift', 'Control', 'Alt', 'Meta', 'OS', 'AltGraph']);
const CODE_MAP = { CapsLock: 'CapsLock', Pause: 'Pause', ScrollLock: 'ScrollLock', Insert: 'Insert', Home: 'Home',
  End: 'End', PageUp: 'PageUp', PageDown: 'PageDown', Space: 'Space', Enter: 'Enter', Tab: 'Tab',
  Backquote: '`', Delete: 'Delete', Escape: 'Esc', ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right' };

let S = null;                 // 从 Python 拿到的状态
let hk = {}, saved = {}, notes = {}, preset = 'pad';
let editing = null, deadline = 0, timer = null, checking = false, toastTimer = null;
const api = () => window.pywebview.api;
const $ = id => document.getElementById(id);

function keyName(e) {
  const c = e.code || '';
  if (/^Key[A-Z]$/.test(c)) return c.slice(3);
  if (/^Digit[0-9]$/.test(c)) return c.slice(5);
  if (/^F([1-9]|1[0-9]|2[0-4])$/.test(c)) return c;
  return CODE_MAP[c] || (e.key && e.key.length === 1 ? e.key.toUpperCase() : null);
}

function info(a) {
  const combo = hk[a.id], note = notes[a.id];
  if (note) return { msg: note, color: 'var(--err)', bad: false };
  if (!combo) return { msg: '', bad: false };
  const dup = S.actions.find(b => b.id !== a.id && hk[b.id] === combo);
  if (dup) return { msg: `和「${dup.label}」重复了`, color: 'var(--err)', bad: true };
  if (combo === 'Ctrl+Alt+W') return { msg: '微信自己也用 Ctrl+Alt+W，需在微信设置里关掉', color: 'var(--warn)', bad: false };
  if (a.hold && combo.split('+').length > 2) return { msg: '要一直按着说话，键越少越好按', color: 'var(--sub)', bad: false };
  if (a.hold && combo.includes('CapsLock')) return { msg: '占用后 CapsLock 不切大小写，打大写请按住 Shift', color: 'var(--sub)', bad: false };
  return { msg: '', bad: false };
}

function render() {
  const rows = $('rows');
  rows.innerHTML = '';
  let anyBad = false;
  const remain = Math.max(0, deadline - Date.now());
  for (const a of S.actions) {
    const inf = info(a);
    anyBad = anyBad || inf.bad;
    const row = document.createElement('div');
    row.className = 'row' + (editing === a.id ? ' editing' : '') + (inf.bad ? ' bad' : '');
    const combo = hk[a.id] || '';
    let keysHtml;
    if (editing === a.id) keysHtml = `<div class="listen"><span class="dot"></span>正在监听… 按下组合键（${Math.ceil(remain / 1000)}s，Esc 取消）</div>`;
    else if (combo) keysHtml = combo.split('+').map(k => `<span class="key">${k}</span>`).join('');
    else keysHtml = '<span class="empty">未设置 · 已停用</span>';
    row.innerHTML = `
      <div class="ico">${svg(ICONS[a.id], 18)}</div>
      <div class="name"><b>${a.label}</b><span>${a.desc}</span></div>
      <div class="combo"><div class="keys">${keysHtml}</div>
        ${inf.msg && editing !== a.id ? `<span class="msg" style="color:${inf.color}">${inf.msg}</span>` : ''}</div>
      <div class="acts">
        <button class="edit">${editing === a.id ? '取消' : '修改'}</button>
        <button class="icon-btn reset" title="恢复默认" aria-label="恢复默认">${svg(RESET, 15)}</button>
        <button class="icon-btn clear" title="清空（停用）" aria-label="清空（停用）">${svg(TRASH, 15)}</button>
      </div>
      ${editing === a.id ? `<div class="progress" style="width:${remain / 50}%"></div>` : ''}`;
    row.querySelector('.edit').onclick = () => toggleEdit(a.id);
    row.querySelector('.reset').onclick = () => {
      stopEdit(); hk[a.id] = (preset === 'keyboard' ? S.keyboard : S.pad)[a.id]; delete notes[a.id]; render();
    };
    row.querySelector('.clear').onclick = () => { stopEdit(); hk[a.id] = ''; delete notes[a.id]; preset = 'custom'; render(); };
    rows.appendChild(row);
  }
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.p === preset));
  const dirty = S.actions.some(a => (hk[a.id] || '') !== (saved[a.id] || ''));
  $('save').disabled = anyBad || !dirty || editing !== null;
  if (!toastTimer) {
    const st = $('status');
    st.style.color = anyBad ? 'var(--err)' : 'var(--sub)';
    st.textContent = anyBad ? '有重复的快捷键，改好后才能保存'
      : dirty ? '有改动还没保存'
      : S.app_running ? '这是当前生效的设置' : 'Pixel Murmur 没在运行，保存后下次启动生效';
  }
}

function toast(text, ok = true) {
  const st = $('status');
  st.style.color = ok ? 'var(--ok)' : 'var(--err)';
  st.textContent = text;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastTimer = null; render(); }, 2600);
}

function toggleEdit(id) {
  if (editing === id) { stopEdit(); render(); return; }
  stopEdit();
  editing = id;
  deadline = Date.now() + 5000;
  api().pause();
  timer = setInterval(() => {
    if (Date.now() > deadline) { stopEdit(); toast('5 秒内没有按键，已取消录入', false); }
    render();
  }, 100);
  render();
}

function stopEdit() {
  if (editing === null) return;
  editing = null;
  clearInterval(timer); timer = null;
  api().resume();
}

document.addEventListener('keydown', async e => {
  if (editing === null) return;
  e.preventDefault(); e.stopPropagation();
  if (checking || MODKEYS.has(e.key)) return;
  const key = keyName(e);
  if (!key) return;
  const id = editing;
  if (key === 'Esc' && !e.ctrlKey && !e.altKey && !e.shiftKey) { stopEdit(); render(); return; }
  const parts = [];
  if (e.ctrlKey) parts.push('Ctrl');
  if (e.altKey) parts.push('Alt');
  if (e.shiftKey) parts.push('Shift');
  parts.push(key);
  const combo = parts.join('+');
  if (parts.length === 1 && !SOLO.has(key)) {
    notes[id] = `单独的「${key}」会拦住平时打字，请加上 Ctrl / Alt / Shift`;
  } else if (BLOCKED[combo]) {
    notes[id] = `${combo} 不能用：${BLOCKED[combo]}`;
  } else {
    checking = true;
    const r = await api().check(combo);          // 主程序快捷键暂停中，向系统试注册一下
    checking = false;
    if (r.ok) { hk[id] = combo; delete notes[id]; preset = 'custom'; }
    else notes[id] = r.msg;
  }
  stopEdit();
  render();
}, true);

document.querySelectorAll('.seg button').forEach(b => b.onclick = async () => {
  const p = b.dataset.p;
  if (p === 'custom') return;
  stopEdit();
  preset = p; notes = {};
  hk = Object.assign({}, p === 'keyboard' ? S.keyboard : S.pad);
  render();
  // 套用后马上检查有没有被别的程序占用（先暂停主程序自己的快捷键，免得把自己算进去）
  await api().pause();
  for (const a of S.actions) {
    if (!hk[a.id]) continue;
    const r = await api().check(hk[a.id]);
    if (!r.ok) notes[a.id] = r.msg;
  }
  await api().resume();
  render();
});

$('revert').onclick = () => { stopEdit(); hk = Object.assign({}, saved); notes = {}; preset = S.preset; render(); toast('已撤销未保存的改动'); };
$('save').onclick = async () => {
  const r = await api().save(hk);
  if (!r.ok) { toast(r.msg, false); return; }
  saved = Object.assign({}, hk);
  S.app_running = r.applied;
  toast(r.applied ? '已保存，立即生效' : '已保存，下次启动 Pixel Murmur 时生效');
  render();
};

// 像素团子头像（和桌宠同一套像素）
(function () {
  const rows = ['................', '................', '................', '.....oooooo.....', '....obbbbbbo....',
    '...obbhhbbbbo...', '..obbhbbbbbbbo..', '..obbbbbbbbbbo..', '.obbbebbbbebbbo.', '.obbbebbbbebbbo.',
    '.obcbbbbbbbbcbo.', '.obbbbbooobbbbo.', '.obbbbbbbbbbbbo.', '..obbbbbbbbbbo..', '...oooooooooo...'];
  const pal = { o: '#2a2320', b: '#E08A5C', h: '#F2BFA2', c: '#F28FA0', e: '#1d1d1d' };
  const sh = [];
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') sh.push(`${x * 3}px ${(y - 1) * 3}px 0 0 ${pal[ch]}`); }));
  $('avatar').style.boxShadow = sh.join(',');
})();

window.addEventListener('pywebviewready', async () => {
  S = await api().state();
  hk = Object.assign({}, S.current);
  saved = Object.assign({}, S.current);
  preset = S.preset;
  render();
});
</script>
</body>
</html>
